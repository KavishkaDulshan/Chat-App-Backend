# BlinkChat — Phase 2 Infrastructure
# Auth routes are extracted to auth-service.
# Remaining monolith handles Chat, Contacts, Media, and Socket.IO.

services:
  gateway:
    image: nginx:alpine
    container_name: chat-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - auth-service
    networks:
      - blinkchat

  auth-service:
    build: ./services/auth-service
    container_name: chat-auth-service
    ports:
      - "3010:3010"
    env_file:
      - ./server/.env
    environment:
      - PORT=3010
      - SERVICE_NAME=auth-service
      - MONGO_URI=mongodb://mongodb:27017/chat-app
      - JWT_SECRET=${JWT_SECRET:-my_super_secret_key_123}
      - E2E_MASTER_KEY=${E2E_MASTER_KEY:-default_master_key_123_ensure_32_bytes_length}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - blinkchat

  backend:
    build: ./server
    container_name: chat-server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - SERVICE_NAME=chat-server
      - MONGO_URI=mongodb://mongodb:27017/chat-app
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-my_super_secret_key_123}
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - blinkchat

  mongodb:
    image: mongo:7
    container_name: chat-mongodb
    volumes:
      - mongo-data:/data/db
    networks:
      - blinkchat

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    networks:
      - blinkchat

volumes:
  mongo-data:

networks:
  blinkchat:
    driver: bridge
