# BlinkChat API Gateway — Docker/Dev environment
# Phase 2: Auth routes are extracted to auth-service.
# Remaining routes go to the monolith backend.

# upstream blocks removed for dynamic resolution

# Future services (uncomment as they're extracted)
# upstream chat-service { server chat-service:3020; }
# upstream contact-service { server contact-service:3030; }
# upstream media-service { server media-service:3040; }
# upstream socket-gateway { server socket-gateway:3001; }

server {
    listen 80;
    server_name localhost;

    # ── Correlation ID ────────────────────────────────────────────────────
    set $correlation_id $http_x_request_id;
    if ($correlation_id = "") {
        set $correlation_id $request_id;
    }

    # Use Docker's internal DNS resolver to avoid caching stale IPs
    resolver 127.0.0.11 valid=5s;
    set $auth_backend "http://auth-service:3010";
    set $main_backend "http://backend:3000";

    # ── Auth Routes → auth-service ────────────────────────────────────────
    location ~ ^/(login|register|verify-otp|forgot-password|reset-password|refresh-token|logout|fcm-token|search|e2e-key|my-e2e-keys|e2e-pin-backup|update-profile) {
        proxy_pass $auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
    }

    # ── User routes → auth-service ───────────────────────────────────────
    location /users/ {
        proxy_pass $auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
    }

    # ── Chat Routes (Phase 4: extract to chat-service) ───────────────────
    location /chat/ {
        proxy_pass $main_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
    }

    # ── Contact Routes (Phase 3: extract to contact-service) ────────────
    location /contacts/ {
        proxy_pass $main_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
    }

    # ── Media Upload Routes (Phase 1: extract to media-service) ─────────
    location /upload {
        proxy_pass $main_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
        client_max_body_size 15M;
    }

    # ── WebSocket / Socket.IO (Phase 5: extract to socket-gateway) ──────
    location /socket.io/ {
        proxy_pass $main_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
