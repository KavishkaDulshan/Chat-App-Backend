# BlinkChat — Phase 0 Infrastructure
# Gateway routes all traffic to the monolith backend.
# Future phases will extract individual services alongside this.

services:
  gateway:
    image: nginx:alpine
    container_name: chat-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - blinkchat

  backend:
    build: ./server
    container_name: chat-server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - SERVICE_NAME=chat-server
      - MONGO_URI=mongodb://mongodb:27017/chat-app
      - REDIS_HOST=redis
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - blinkchat

  mongodb:
    image: mongo:7
    container_name: chat-mongodb
    volumes:
      - mongo-data:/data/db
    networks:
      - blinkchat

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    networks:
      - blinkchat

volumes:
  mongo-data:

networks:
  blinkchat:
    driver: bridge
