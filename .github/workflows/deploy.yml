name: Deploy to Azure VM

on:
  push:
    branches: [ "main" ]  # Triggers on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "🚀 Starting Deployment..."

          # ── Rebuild and restart Docker backend ──

          # ── Rebuild and restart Docker backend (no-deps: don't touch infra) ──
          cd ~/Chat-App-Backend
          git reset --hard
          git pull origin main

          echo "🐳 Rebuilding Docker Containers..."
          sudo docker compose build backend auth-service gateway
          sudo docker compose up -d backend auth-service gateway

          echo "✅ Deployment Successful!"
